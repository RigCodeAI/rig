name: Feature request
description: Suggest an improvement to Rig.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Explain the problem you want Rig to help with.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would help?
      description: Describe your suggestion and any alternatives you have tried.
    validations:
      required: true
